<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Hub</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../shared/shared-auth.js"></script>
  <script src="../shared/game-registry.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:#0b1020;color:#fff}
    .shell{width:min(1180px,92%);margin:auto;padding:28px 0 50px}
    header{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:46px}
    .brand{font-size:28px;font-weight:800;letter-spacing:-1px}
    .brand span{opacity:.55;font-weight:600}
    .account{display:flex;align-items:center;gap:10px}
    .login,.profile{border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:#fff;border-radius:12px;padding:10px 14px;font-weight:700}
    .profile{display:none;align-items:center;gap:9px}
    .avatar{width:30px;height:30px;border-radius:50%;object-fit:cover;background:#252c43}
    .hero{padding:36px 0 26px}
    .eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:2px;opacity:.5;font-weight:700}
    h1{font-size:clamp(42px,7vw,76px);line-height:.95;letter-spacing:-4px;margin:12px 0 16px}
    .hero p{max-width:620px;color:#aeb6ca;line-height:1.6;font-size:16px}
    .games{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:30px}
    .card{min-height:240px;padding:24px;border:1px solid rgba(255,255,255,.1);border-radius:20px;background:linear-gradient(145deg,rgba(30,38,68,.9),rgba(16,21,39,.9));display:flex;flex-direction:column;transition:.18s ease}
    .card:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.22)}
    .icon{font-size:32px;margin-bottom:24px}.card h2{font-size:24px}.card p{color:#9ea8bd;line-height:1.5;margin:10px 0 22px;flex:1}
    .play{display:inline-flex;justify-content:center;text-decoration:none;padding:12px 16px;border-radius:11px;background:#fff;color:#101522;font-weight:800}
    .disabled{opacity:.5;cursor:not-allowed;background:rgba(255,255,255,.1);color:#fff}
    .note{margin-top:24px;color:#78839c;font-size:13px}
    @media(max-width:800px){.games{grid-template-columns:1fr 1fr}}@media(max-width:560px){header{margin-bottom:20px}.games{grid-template-columns:1fr}h1{letter-spacing:-2px}}
  </style>
</head>
<body>
<div class="shell">
  <header>
    <div class="brand">Game Hub <span>by Baby</span></div>
    <div class="account">
      <button id="loginBtn" class="login">Log in</button>
      <button id="profileBtn" class="profile">
        <img id="avatar" class="avatar" alt="">
        <span id="displayName">Player</span>
      </button>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="eyebrow">One account · Every game</div>
      <h1>Pick a game.</h1>
      <p>Your account, profile, avatar and future game scores can be shared across Quiz, Drawzy and Puzzle. Each game stays independently editable.</p>
    </section>
    <section id="games" class="games"></section>
    <div class="note">The Hub is the shared entry point. Individual games remain separate projects.</div>
  </main>
</div>
<script>
const SUPABASE_URL = 'https://wnjsajfahsqunfesmetu.supabase.co';
const SUPABASE_KEY = 'sb_publishable_S_ePD9oEegH0R0XR8LGvjQ_sMs';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
SharedAccount.init(supabaseClient);

const gamesEl = document.getElementById('games');
const loginBtn = document.getElementById('loginBtn');
const profileBtn = document.getElementById('profileBtn');
const displayName = document.getElementById('displayName');
const avatar = document.getElementById('avatar');

function renderGames(){
  gamesEl.innerHTML = GameRegistry.all().map(game => {
    const live = game.status === 'live';
    return `<article class="card">
      <div class="icon">${game.icon}</div>
      <h2>${game.name}</h2>
      <p>${game.description}</p>
      ${live ? `<a class="play" href="${game.url}">Play</a>` : `<span class="play disabled">Coming soon</span>`}
    </article>`;
  }).join('');
}

async function refreshAccount(){
  try{
    const {user,profile} = await SharedAccount.getAccount();
    if(!user){
      loginBtn.style.display='block'; profileBtn.style.display='none'; return;
    }
    loginBtn.style.display='none'; profileBtn.style.display='flex';
    displayName.textContent = profile?.display_name || user.email?.split('@')[0] || 'Player';
    avatar.src = profile?.avatar_url || `https://ui-avatars.com/api/?name=${encodeURIComponent(displayName.textContent)}&background=252c43&color=fff`;
  }catch(err){ console.error('Hub account error:',err); }
}

loginBtn.addEventListener('click', async () => {
  // Uses the same Supabase Auth system as the existing Quiz site.
  const {error} = await supabaseClient.auth.signInWithOAuth({
    provider:'google',
    options:{redirectTo:window.location.href}
  });
  if(error) alert(error.message);
});

profileBtn.addEventListener('click', async () => {
  if(confirm('Sign out?')) await SharedAccount.signOut();
});

renderGames();
refreshAccount();
SharedAccount.onAuthChange(() => refreshAccount());
</script>
</body>
</html>
