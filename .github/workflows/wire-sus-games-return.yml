name: Wire Sus Games return button
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject bridge
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="./quiz-hub-return.js"></script>'
          if tag not in s:
              pos=s.lower().rfind('</body>')
              if pos==-1: raise SystemExit('no body')
              s=s[:pos]+'\n'+tag+'\n'+s[pos:]
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit wiring
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m "Add Main Hub return bridge"
          git push
